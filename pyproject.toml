[project]
name = "nyc-restrooms"
version = "0.0.1"
description = "NYC restroom deserts, restroom-likelihood model, and delivery-worker bathroom-rights map"
requires-python = ">=3.13"
dependencies = ["requests>=2.32"]

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.8"]

[project.scripts]
restrooms = "restrooms.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restrooms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network endpoints (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
