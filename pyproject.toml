[project]
name = "nyc-restrooms"
version = "0.0.1"
description = "NYC restroom deserts, restroom-likelihood model, and delivery-worker bathroom-rights map"
requires-python = ">=3.13"
dependencies = [
    "h3>=4.5.1",
    "opening-hours-py>=2.1.6",
    "osmium>=4.3.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "rapidfuzz>=3.14.6",
    "requests>=2.32",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.8"]

[project.scripts]
restrooms = "restrooms.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restrooms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network endpoints (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
