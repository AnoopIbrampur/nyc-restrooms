name: source-check
# Weekly live check that every registered dataset still resolves with the expected fields.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run restrooms check-sources
