name: nightly-data
# Refreshes the public app data (docs/data/restrooms.json) from the NYC Public Restrooms
# table. Never touches the pre-registered analysis outputs. Commits only when the data
# changed and the validation gate passed; GitHub Pages then republishes automatically.
on:
  schedule:
    - cron: "40 9 * * *"  # ~4:40-5:40 am New York time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Rebuild app data (fails on validation errors)
        run: uv run restrooms app-data
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/data; then
            echo "No change in restroom data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Nightly data refresh ($(date -u +%F))"
          git push
